<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooflix</title>
    <link rel="stylesheet" href="style.css">

</head>

<body id="body">
    <div class="header">
        <div class="header-content">
            <h1>Smooflix</h1>
            <p>Entdecke deinen perfekte Smoothie</p>
        </div>

        <div class="main">
            <div id="search-container">
                <input type="text" id="search-input" placeholder="Smoothie Name">
                <button id="search-button">Suchen</button>
            </div>
            <div id="results-container">

                <div id="smoothie-details-container">
                    <h2>Schreiben Sie den Namen des Smoothies</h2>
                </div>

            </div>
        </div>

        <script src="./smooflix.js"></script>
</body>

</html>
